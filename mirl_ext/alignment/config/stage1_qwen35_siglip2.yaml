# Stage 1: train Qwen3.5's vision encoder on native time series and preserve images.
# Experiment history and rationale live in mirl_ext/CLAUDE.md.

log_level: INFO

data:
  root: ${oc.env:MIRL_DATA_ROOT,/work/mit/ppliang_mit/alecz/data/trainedve_raw}
  train_files:
    - ${data.root}/smellnet_train_clean.parquet
    - ${data.root}/ecg_train_nan_filtered.parquet
    - ${data.root}/haptic_ts_train.parquet
    - ${data.root}/climb_train.parquet
    - ${data.root}/human_behaviour_train.parquet
    - ${data.root}/tactile_train.parquet
  val_files:
    - ${data.root}/smellnet_valid_clean.parquet
    - ${data.root}/ecg_valid_nan_filtered.parquet
    - ${data.root}/haptic_ts_valid.parquet
    - ${data.root}/climb_valid.parquet
    - ${data.root}/human_behaviour_valid.parquet
    - ${data.root}/tactile_valid.parquet
  balanced_sampling_key: data_source
  # Stage 1 currently learns the 50-way single-substance task only. Remove mixture
  # rows before label vocabularies, samplers, losses, and validation metrics exist.
  exclude_data_sources: [smellnet_mixture]
  include_all_ts: true

  # Exact microbatch per rank: 2 from each signal family and 10 images/videos.
  # Four-step accumulation preserves 8/family + 40 media per optimizer update.
  # Validation uses five batches of ten rows per family. That visits every one of
  # the 50 base SmellNet validation recordings exactly once.
  ts_per_family_per_batch: 2
  val_ts_per_family_per_batch: 10

  text_for_label: ground_truth
  # The raw captions are unique per recording. Use the participant-independent
  # two-level task encoded in the controlled 3DHaptic stem for reusable positives.
  tactile_label_mode: stem_task_pair
  enable_videos: true
  max_video_frames: 8
  image_patch_size: 16
  tactile_max_frames: 256
  temporal_crop_steps:
    smell: 100
    ecg: 750
    tactile: 21

model:
  qwen35_path: /work/mit/ppliang_mit/alecz/hf_cache/hub/models--Qwen--Qwen3.5-9B/snapshots/c202236235762e1c871ad0ccb60c8ee5ba337b9a
  siglip2_text_path: /work/mit/ppliang_mit/alecz/hf_cache/models--google--siglip2-so400m-patch16-naflex/snapshots/cc24074f717b612951c2dead130904ab9b65a81e
  trainable_visual_dtype: bf16
  # ECG tensors were already standardized when the CLIMB indexes were built.
  ecg_normalization: prestandardized
  tactile_delta_channels: true

projection:
  shared_dim: 512
  hidden_dim: null

loss:
  temperature: 0.07
  prototype_families: [smell, ecg, tactile]

loss_weights:
  ts_text: 1.0
  distill_img: 1.0

train:
  # Batch 32 at four video frames used 176 GiB/B200 without checkpointing.
  # Batch 16 with four-step accumulation preserves effective global batch 256.
  batch_size: 16
  grad_accum_steps: 4
  num_workers: 4
  prefetch_factor: 2
  lr: 1.0e-5
  # Keep the linear alignment adapters from outrunning the transferable encoder.
  # F1 is measured after these adapters, so a 10x head LR can improve F1 while the
  # raw Qwen tower barely moves. Equal LR keeps the bridge learnable but unfavored.
  head_lr: 1.0e-5
  scalar_lr: 3.0e-3
  weight_decay: 0.05
  # The trainer derives optimizer steps from the distributed sampler and accumulation.
  num_train_epochs: 1
  warmup_ratio: 0.03
  # Interval values are optimizer steps, not micro-batches.
  grad_clip: 1.0
  amp_dtype: bf16
  log_every: 10
  ckpt_every: 100
  val_every: 100
  val_batches: 5
  val_batch_size: 128
  # Select the encoder against the direct deployment objective.
  best_metric: val-core/accuracy/smellnet
  output_dir: ${oc.env:MIRL_OUTPUT_DIR,/scratch/dvdai_mit/alecz/checkpoints/alignment_qwen35}

wandb:
  enable: true
  project: mirl-alignment
  name: ${oc.env:WANDB_RUN_ID,stage1_qwen35_siglip2}
