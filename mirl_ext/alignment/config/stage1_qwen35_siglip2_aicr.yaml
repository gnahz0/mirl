# Stage 1 on AICR: train Qwen3.5's vision encoder on native time series and preserve images.
# Experiment history and rationale live in mirl_ext/CLAUDE.md.

log_level: INFO

data:
  root: ${oc.env:MIRL_ALIGN_DATA_ROOT,data/trainedve_raw}
  train_files:
    - ${data.root}/ecg_train_nan_filtered.parquet
    - ${data.root}/haptic_ts_train.parquet
    - ${data.root}/climb_train.parquet
    - ${data.root}/human_behaviour_train.parquet
    - ${data.root}/tactile_train.parquet
  val_files:
    - ${data.root}/ecg_valid_nan_filtered.parquet
    - ${data.root}/haptic_ts_valid.parquet
    - ${data.root}/climb_valid.parquet
    - ${data.root}/human_behaviour_valid.parquet
    - ${data.root}/tactile_valid.parquet
  # tactile_{train,valid} supplies both closed QA labels for haptic_ts and
  # visual-preservation anchors.
  # The loader excludes mixtures; Stage 1 learns the 50-way base-substance task.

  # Batches contain one media kind and one data_source.

  max_video_frames: 8
  max_image_tokens: 1024

model:
  qwen35_path: ${oc.env:MIRL_QWEN35_PATH,Qwen/Qwen3.5-9B}
  siglip2_text_path: ${oc.env:MIRL_SIGLIP2_PATH,google/siglip2-so400m-patch16-naflex}

loss:
  siglip_weight: 1.0
  distill_weight: 1.0

train:
  seed: 42
  # Exact file paths, no directory resolution. init_checkpoint points at an
  # alignment_state.pt (e.g. $MIRL_SCRATCH_ROOT/checkpoints/<run>/best/alignment_state.pt)
  # and warm-starts weights on a fresh schedule. resume_checkpoint points at the
  # matching last/trainer_state.pt and requires init_checkpoint to be set to the
  # sibling last/alignment_state.pt.
  init_checkpoint: null
  resume_checkpoint: null
  # Repeat complete shuffled passes over low-resource signal sources. Values are
  # positive integers; omitted sources and all visual sources repeat once.
  # Validation is always one-pass. These factors approximate alpha=0.25
  # temperature sampling across the signal sources.
  signal_repeat_factors:
    haptic_tactile: 11
  # Four GPUs and two-step accumulation give a global batch of up to 256.
  batch_size: 32
  grad_accum_steps: 2
  gradient_checkpointing: true
  num_workers: 4
  lr: 1.0e-5
  weight_decay: 0.0
  num_train_epochs: 3
  warmup_ratio: 0.03
  grad_clip: 1.0
  val_every: 200
  val_batch_size: 256
  best_metric: val-core/map/overall
  output_dir: ${oc.env:MIRL_OUTPUT_DIR,checkpoints/alignment_qwen35_canonical_siglip}

wandb:
  project: mirl-alignment
  name: ${oc.env:WANDB_RUN_ID,stage1_qwen35_canonical_siglip}
