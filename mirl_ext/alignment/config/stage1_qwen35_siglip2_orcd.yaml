# Tactile ablation on MIT ORCD.

log_level: INFO

data:
  root: ${oc.env:MIRL_DATA_ROOT,/orcd/scratch/orcd/010/alecz/mirl-qwen35/data}
  train_files:
    - ${data.root}/haptic_ts_train.parquet
  train_annotation_files:
    - ${data.root}/tactile_train.parquet
  val_files:
    - ${data.root}/haptic_ts_valid.parquet
  val_annotation_files:
    - ${data.root}/tactile_valid.parquet
  tasks:
    - initial_fingers
    - highest_pressure
    - force_level
    - grip_stability
    - contact_feature
    - local_shape
  max_tokens_per_sample: 1024

  # These Parquets were built on the previous cluster. Rewrite only embedded
  # paths in memory; the source indexes remain unchanged.
  path_rewrites:
    /scratch/dvdai_mit/alecz/align_raw/3DHaptic: /orcd/compute/ppliang/001/raofu/3DHaptic
    /scratch/dvdai_mit/alecz/data/3DHaptic: /orcd/compute/ppliang/001/raofu/3DHaptic

model:
  qwen35_path: ${oc.env:MIRL_QWEN35_PATH,/orcd/scratch/orcd/010/alecz/mirl-qwen35/models/qwen35-ve}
  siglip2_text_path: ${oc.env:MIRL_SIGLIP2_PATH,/orcd/scratch/orcd/010/alecz/mirl-qwen35/models/siglip2-text}
loss:
  temperature: 0.07
  siglip_weight: 1.0

train:
  seed: 42
  # init_checkpoint loads encoder/scalar weights into a fresh optimizer and
  # schedule. resume_checkpoint instead restores the matching `last/` trainer
  # state and must use the same planned schedule and sampler geometry.
  init_checkpoint: null
  resume_checkpoint: null
  # Two GPUs and four-step accumulation give an effective batch of 256.
  batch_size: 32
  grad_accum_steps: 4
  num_workers: 4
  lr: 1.0e-5
  scalar_lr: 3.0e-3
  weight_decay: 0.05
  num_train_epochs: 5
  warmup_ratio: 0.03
  grad_clip: 1.0
  amp_dtype: bf16
  val_every: 200
  val_batch_size: 128
  best_metric: val-core/f1_macro/tactile
  output_dir: ${oc.env:MIRL_OUTPUT_DIR,/orcd/scratch/orcd/010/alecz/mirl-qwen35/checkpoints/tactile_structured}

wandb:
  enable: true
  project: mirl-alignment
  name: ${oc.env:WANDB_RUN_ID,tactile_structured_orcd}
